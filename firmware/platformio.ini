; esp-maps - Waveshare ESP32-S3-Touch-AMOLED-1.8
;
; Everything that would otherwise be a board-menu setting in the Arduino IDE
; lives here instead, in version control, where getting it wrong is visible in
; a diff rather than silently costing you 4x memory bandwidth.

[env:amoled18]
; The OFFICIAL platformio espressif32 platform still ships Arduino core
; 2.0.17, which predates esp32-hal-periman.h - Arduino_GFX 1.6.x will not
; compile against it. pioarduino is the community fork that tracks current
; Arduino-ESP32 releases; this pin is core 3.3.11 on ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ---- memory ---------------------------------------------------------------
; The R8 part is OCTAL PSRAM. qio_opi means QIO flash + OPI PSRAM, and it is
; the single most important line in this file: in quad mode the framebuffer
; and tile cache run at roughly a quarter of the bandwidth, which shows up
; directly as frame time.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; ---- speed ----------------------------------------------------------------
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    ; USB CDC so Serial goes over the single USB-C port.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; Board revision: 2 = CO5300/CST816 (current boards), 1 = SH8601/FT3168.
    ; See docs/BOARD_BRINGUP.md - first boot prints an I2C scan that tells you
    ; which one you have.
    -DESPMAPS_BOARD_REV=2
    ; The rasteriser and projection code is the whole frame budget.
    -O2

build_unflags =
    -Os

lib_deps =
    ; Panel driver. Provides Arduino_ESP32QSPI + Arduino_CO5300, which is
    ; exactly what Waveshare's own demos for this board use.
    moononournation/GFX Library for Arduino@^1.5.0
    ; BLE. Written against the 2.x API (NimBLEConnInfo in callbacks); if you
    ; pin 1.x instead, the callback signatures in src/ble/ble_link.cpp differ.
    h2zero/NimBLE-Arduino@^2.1.0

; PlatformIO compiles everything under src/ recursively, so the module layout
; is preserved as-is - no flat sketch folder needed.
