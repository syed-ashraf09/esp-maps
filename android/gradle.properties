org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Put your keys here rather than in source. Both are read in app/build.gradle.kts
# and injected as BuildConfig fields.
#
#   MapTiler: https://cloud.maptiler.com/account/keys/  (free tier, no card)
#   GraphHopper: https://graphhopper.com/dashboard/     (free tier, one-time key)
#
# Leaving GRAPHHOPPER_KEY empty makes the app fall back to the keyless OSRM
# demo server, which works but is rate-limited and demo-only.
MAPTILER_KEY=
GRAPHHOPPER_KEY=
